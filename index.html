<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Mua Acc - Uy Tín & Chất Lượng</title>
    <!-- Nhập font chữ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f19;
            color: #ffffff;
        }

        /* Canvas nền 3D tuyết rơi */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Hộp nội dung chính (Glassmorphism) */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }

        /* Nhóm nút bấm liên kết */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Nút Zalo */
        .btn-zalo {
            background: linear-gradient(135deg, #0068ff, #0052cc);
            color: #ffffff;
        }

        .btn-zalo:hover {
            background: linear-gradient(135deg, #0052cc, #003d99);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 104, 255, 0.4);
        }

        /* Nút Telegram */
        .btn-telegram {
            background: linear-gradient(135deg, #229ed9, #1b81b2);
            color: #ffffff;
        }

        .btn-telegram:hover {
            background: linear-gradient(135deg, #1b81b2, #14648c);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 158, 217, 0.4);
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Khung chứa hiệu ứng 3D Tuyết
